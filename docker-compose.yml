services:
  db:
    image: postgres:16-alpine
    container_name: produtos_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: produtosdb
      POSTGRES_USER: produtosuser
      POSTGRES_PASSWORD: produtospass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U produtosuser -d produtosdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: produtos_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://produtosuser:produtospass@db:5432/produtosdb
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: produtos_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
